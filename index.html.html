<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关注者画像追踪</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg:        #0f0f11;
  --bg2:       #141416;
  --bg3:       #1a1a1f;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.04);
  --text:      #e8e8ec;
  --text2:     #9898a6;
  --text3:     #55555f;
  --accent:    #7c6af7;
  --accent2:   #9b8cff;
  --green:     #34d399;
  --red:       #f87171;
  --amber:     #fbbf24;
  --card-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 4px 24px rgba(0,0,0,0.4);
  --card-shadow-hover: 0 1px 0 rgba(255,255,255,0.06) inset, 0 8px 32px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 20px 60px;
  -webkit-font-smoothing: antialiased;
}

/* Subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(124,106,247,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,106,247,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.wrap { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #7c6af7, #5b4fd4);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 0 0 0 1px rgba(124,106,247,0.3), 0 4px 16px rgba(124,106,247,0.25);
  transform: perspective(60px) rotateX(4deg);
}
h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.3px;
}
.subtitle {
  font-size: 12px;
  color: var(--text3);
  margin-top: 3px;
  letter-spacing: 0.1px;
}

/* ── Button ── */
.btn-primary {
  background: linear-gradient(135deg, #7c6af7, #5b4fd4);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: -0.1px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 4px 12px rgba(124,106,247,0.35);
  transition: all 0.15s ease;
  transform: perspective(60px) rotateX(2deg);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #8d7ef8, #6c60e5);
  box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 6px 20px rgba(124,106,247,0.45);
  transform: perspective(60px) rotateX(2deg) translateY(-1px);
}
.btn-primary:active { transform: perspective(60px) rotateX(2deg) translateY(0); }

.saved-msg {
  font-size: 12px;
  color: var(--green);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 24px;
  background: var(--bg3);
  border-radius: 10px;
  padding: 3px;
  width: fit-content;
  border: 1px solid var(--border);
}
.tab {
  border: none;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  background: transparent;
  color: var(--text3);
  transition: all 0.15s ease;
  white-space: nowrap;
  letter-spacing: -0.1px;
}
.tab:hover { color: var(--text2); }
.tab.active {
  background: var(--bg2);
  color: var(--text);
  box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 2px 8px rgba(0,0,0,0.3);
  border: 1px solid var(--border);
}

/* ── Cards ── */
.card {
  background: var(--bg2);
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--card-shadow);
  overflow: hidden;
}

/* ── Table ── */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  padding: 11px 14px;
  text-align: center;
  font-weight: 500;
  white-space: nowrap;
  color: var(--text3);
  font-size: 11.5px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
td {
  padding: 10px 14px;
  text-align: center;
  border-bottom: 1px solid var(--border2);
  color: var(--text);
}
thead { background: var(--bg3); }
.sc { position: sticky; z-index: 1; }
.cg { left: 0; min-width: 68px; text-align: left !important; background: var(--bg3); }
.cl { left: 68px; min-width: 96px; text-align: left !important; background: var(--bg3); }
thead .cg, thead .cl { background: var(--bg3); z-index: 2; }
tbody .cg, tbody .cl { background: var(--bg2); }
tbody tr:hover td,
tbody tr:hover .cg,
tbody tr:hover .cl { background: rgba(124,106,247,0.04) !important; }
.total-row td,
.total-row .cg,
.total-row .cl { background: rgba(124,106,247,0.06) !important; border-bottom: 1px solid rgba(124,106,247,0.15) !important; }
.other-row td,
.other-row .cg,
.other-row .cl { opacity: 0.45; font-style: italic; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.badge-gender { background: rgba(244,63,94,0.15); color: #fb7185; border: 1px solid rgba(244,63,94,0.2); }
.badge-device { background: rgba(14,165,233,0.15); color: #38bdf8; border: 1px solid rgba(14,165,233,0.2); }
.badge-age    { background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
.badge-region { background: rgba(52,211,153,0.12); color: #34d399; border: 1px solid rgba(52,211,153,0.2); }

.up { color: var(--green); font-size: 11px; font-weight: 600; }
.dn { color: var(--red);   font-size: 11px; font-weight: 600; }
.nt { color: var(--text3); font-size: 11px; }
.val { font-weight: 600; font-size: 13px; color: var(--text); }
.pct { font-size: 11px; color: var(--text3); margin-top: 1px; }

.del-btn {
  font-size: 10px;
  color: var(--text3);
  background: none;
  border: none;
  cursor: pointer;
  display: block;
  margin: 3px auto 0;
  font-family: inherit;
  transition: color 0.15s;
}
.del-btn:hover { color: var(--red); }

/* ── Daily cards ── */
.day-card {
  background: var(--bg2);
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--card-shadow);
  margin-bottom: 12px;
  overflow: hidden;
  transition: box-shadow 0.2s, border-color 0.2s;
}
.day-card:hover { border-color: rgba(124,106,247,0.2); box-shadow: var(--card-shadow-hover); }

.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.day-header.open-header { border-bottom-color: var(--border); }
.day-header:hover { background: rgba(255,255,255,0.02); }

.day-date-row { display: flex; align-items: center; gap: 10px; }
.day-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px rgba(124,106,247,0.6);
  flex-shrink: 0;
}
.day-date { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
.day-total { font-size: 12px; color: var(--text3); }
.day-tog { font-size: 12px; color: var(--text3); transition: transform 0.2s; }
.day-tog.open { transform: rotate(180deg); }

.day-body { padding: 18px 20px; display: none; }
.day-body.open { display: block; }

.day-section { margin-bottom: 16px; }
.day-section:last-of-type { margin-bottom: 0; }
.day-sec-title {
  font-size: 10px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
}
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  transition: all 0.15s;
}
.pill:hover { border-color: rgba(124,106,247,0.3); color: var(--text); }
.pill-hi {
  background: rgba(124,106,247,0.12);
  border-color: rgba(124,106,247,0.3);
  color: var(--accent2);
}
.pill-other {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text3);
  font-style: italic;
}

.day-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
.btn-sm {
  font-size: 12px;
  font-family: inherit;
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 500;
}
.btn-edit {
  color: var(--text2);
  background: var(--bg3);
  border: 1px solid var(--border);
}
.btn-edit:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
.btn-delete {
  color: var(--red);
  background: rgba(248,113,113,0.06);
  border: 1px solid rgba(248,113,113,0.2);
}
.btn-delete:hover { background: rgba(248,113,113,0.12); }

/* ── Chart cards ── */
.chart-card {
  background: var(--bg2);
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--card-shadow);
  padding: 22px 22px 18px;
  margin-bottom: 16px;
  transition: box-shadow 0.2s, border-color 0.2s;
}
.chart-card:hover { border-color: rgba(124,106,247,0.15); }
.chart-title { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; margin-bottom: 3px; }
.chart-sub { font-size: 11.5px; color: var(--text3); margin-bottom: 18px; }
.chart-wrap { position: relative; height: 240px; }
.no-data { color: var(--text3); font-size: 13px; padding: 32px 0; text-align: center; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--bg2);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  width: 100%;
  max-width: 580px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 24px 60px rgba(0,0,0,0.6);
}
.modal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  letter-spacing: -0.3px;
}
.modal-hint {
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 22px;
  line-height: 1.7;
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 10px 14px;
  border-radius: 8px;
}
.modal-hint strong { color: var(--text2); }
.modal-close {
  border: 1px solid var(--border);
  background: var(--bg3);
  border-radius: 7px;
  width: 30px; height: 30px;
  cursor: pointer;
  color: var(--text3);
  font-size: 14px;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

.fg { margin-bottom: 14px; }
.fg label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 6px;
  letter-spacing: -0.1px;
}
.fg input {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13.5px;
  font-family: inherit;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.fg input:focus { border-color: var(--accent); }
.fg input::placeholder { color: var(--text3); }

.fsec {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text3);
  margin: 18px 0 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.fsec-auto { font-size: 10px; font-weight: 400; color: var(--text3); text-transform: none; letter-spacing: 0; font-style: italic; }

.fgrid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 4px; }
.fgrid label { font-size: 11.5px; color: var(--text3); display: block; margin-bottom: 5px; font-weight: 500; }
.fgrid input {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.fgrid input:focus { border-color: var(--accent); }
.fgrid input::placeholder { color: var(--text3); font-size: 11px; }
.fgrid input.optional {
  border-style: dashed;
  border-color: rgba(255,255,255,0.06);
  background: rgba(124,106,247,0.03);
}
.fgrid input.optional:focus { border-style: solid; border-color: var(--accent); }

.save-btn {
  width: 100%;
  background: linear-gradient(135deg, #7c6af7, #5b4fd4);
  color: #fff;
  border: none;
  border-radius: 9px;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  margin-top: 14px;
  letter-spacing: -0.2px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 4px 16px rgba(124,106,247,0.35);
  transition: all 0.15s;
}
.save-btn:hover {
  box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 6px 20px rgba(124,106,247,0.45);
  transform: translateY(-1px);
}

/* ── Scrollbar ── */
::-webkit-scrollbar { height: 5px; width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">📊</div>
      <div>
        <h1>关注者画像追踪</h1>
        <div class="subtitle">每日录入人数 · 自动计算占比 · 追踪趋势变化</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="savedMsg" class="saved-msg" style="display:none">✓ 已保存</span>
      <button class="btn-primary" onclick="openForm()">+ 录入数据</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('table',this)">横向对比</button>
    <button class="tab" onclick="switchTab('daily',this)">每日记录</button>
    <button class="tab" onclick="switchTab('trend',this)">折线趋势</button>
  </div>

  <div id="tableView"></div>
  <div id="dailyView" style="display:none"></div>
  <div id="trendView"  style="display:none"></div>
</div>

<!-- Modal -->
<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeForm()">
  <div class="modal">
    <div class="modal-title">
      录入数据
      <button class="modal-close" onclick="closeForm()">✕</button>
    </div>
    <div class="modal-hint">
      填写<strong>实际人数</strong>，百分比自动计算。虚线框字段可不填，系统自动补齐「总人数 − 已填项之和」。
    </div>

    <div class="fg"><label>日期</label><input type="date" id="f_date"></div>
    <div class="fg"><label>总人数</label><input type="number" id="f_total" placeholder="例如 10484"></div>

    <div class="fsec">性别 <span class="fsec-auto">未知项可自动补齐</span></div>
    <div class="fgrid">
      <div><label>男性（人）</label><input type="number" id="f_male" placeholder="0"></div>
      <div><label>女性（人）</label><input type="number" id="f_female" placeholder="0"></div>
      <div><label>性别未知（可选）</label><input type="number" id="f_gender_unknown" placeholder="自动补齐" class="optional"></div>
    </div>

    <div class="fsec">访问设备 <span class="fsec-auto">未知项可自动补齐</span></div>
    <div class="fgrid">
      <div><label>iOS（人）</label><input type="number" id="f_ios" placeholder="0"></div>
      <div><label>安卓（人）</label><input type="number" id="f_android" placeholder="0"></div>
      <div><label>设备未知（可选）</label><input type="number" id="f_device_unknown" placeholder="自动补齐" class="optional"></div>
    </div>

    <div class="fsec">年龄分布 <span class="fsec-auto">未知项可自动补齐</span></div>
    <div class="fgrid">
      <div><label>17岁以下</label><input type="number" id="f_age_under17" placeholder="0"></div>
      <div><label>18-24岁</label><input type="number" id="f_age_18_24" placeholder="0"></div>
      <div><label>25-29岁</label><input type="number" id="f_age_25_29" placeholder="0"></div>
      <div><label>30-39岁</label><input type="number" id="f_age_30_39" placeholder="0"></div>
      <div><label>40-49岁</label><input type="number" id="f_age_40_49" placeholder="0"></div>
      <div><label>50岁以上</label><input type="number" id="f_age_50plus" placeholder="0"></div>
      <div><label>年龄未知（可选）</label><input type="number" id="f_age_unknown" placeholder="自动补齐" class="optional"></div>
    </div>

    <div class="fsec">地域分布 <span class="fsec-auto">其他地区可自动补齐</span></div>
    <div class="fgrid">
      <div><label>上海市</label><input type="number" id="f_shanghai" placeholder="0"></div>
      <div><label>江苏省</label><input type="number" id="f_jiangsu" placeholder="0"></div>
      <div><label>广东省</label><input type="number" id="f_guangdong" placeholder="0"></div>
      <div><label>浙江省</label><input type="number" id="f_zhejiang" placeholder="0"></div>
      <div><label>北京市</label><input type="number" id="f_beijing" placeholder="0"></div>
      <div><label>其他地区（可选）</label><input type="number" id="f_region_other" placeholder="自动补齐" class="optional"></div>
    </div>

    <button class="save-btn" onclick="saveRecord()">保存记录</button>
  </div>
</div>

<script>
const SK = 'follower_tracker_v3';

const AUTO_KEYS = {
  gender_unknown: ['male','female'],
  device_unknown: ['ios','android'],
  age_unknown:    ['age_under17','age_18_24','age_25_29','age_30_39','age_40_49','age_50plus'],
  region_other:   ['shanghai','jiangsu','guangdong','zhejiang','beijing'],
};

const INPUT_KEYS = ['total','male','female','gender_unknown','ios','android','device_unknown',
  'age_under17','age_18_24','age_25_29','age_30_39','age_40_49','age_50plus','age_unknown',
  'shanghai','jiangsu','guangdong','zhejiang','beijing','region_other'];

const FIELDS = [
  {key:'male',          label:'男性',     group:'性别'},
  {key:'female',        label:'女性',     group:'性别'},
  {key:'gender_unknown',label:'性别未知', group:'性别', isAuto:true},
  {key:'ios',           label:'iOS',      group:'设备'},
  {key:'android',       label:'安卓',     group:'设备'},
  {key:'device_unknown',label:'设备未知', group:'设备', isAuto:true},
  {key:'age_under17',   label:'17岁以下', group:'年龄'},
  {key:'age_18_24',     label:'18-24岁',  group:'年龄'},
  {key:'age_25_29',     label:'25-29岁',  group:'年龄'},
  {key:'age_30_39',     label:'30-39岁',  group:'年龄'},
  {key:'age_40_49',     label:'40-49岁',  group:'年龄'},
  {key:'age_50plus',    label:'50岁以上', group:'年龄'},
  {key:'age_unknown',   label:'年龄未知', group:'年龄', isAuto:true},
  {key:'shanghai',      label:'上海市',   group:'地域'},
  {key:'jiangsu',       label:'江苏省',   group:'地域'},
  {key:'guangdong',     label:'广东省',   group:'地域'},
  {key:'zhejiang',      label:'浙江省',   group:'地域'},
  {key:'beijing',       label:'北京市',   group:'地域'},
  {key:'region_other',  label:'其他地区', group:'地域', isAuto:true},
];
const GROUPS = ['性别','设备','年龄','地域'];
const BC = {'性别':'badge-gender','设备':'badge-device','年龄':'badge-age','地域':'badge-region'};
const GP = {
  '性别': ['#f472b6','#60a5fa','rgba(255,255,255,0.2)'],
  '设备': ['#38bdf8','#a78bfa','rgba(255,255,255,0.2)'],
  '年龄': ['#fbbf24','#fb923c','#34d399','#60a5fa','#a78bfa','#f87171','rgba(255,255,255,0.15)'],
  '地域': ['#34d399','#fbbf24','#fb923c','#60a5fa','#a78bfa','rgba(255,255,255,0.15)'],
};

const SEED = [
  {
    date:'2026-04-22', total:10294,
    male:1609, female:8633, gender_unknown:52,
    ios:5067, android:4196, device_unknown:1031,
    age_under17:118, age_18_24:64, age_25_29:154,
    age_30_39:2418, age_40_49:6875, age_50plus:664, age_unknown:1,
    shanghai:7266, jiangsu:441, guangdong:330, zhejiang:289, beijing:229,
    region_other:1739
  },
  {
    date:'2026-04-23', total:10484,
    male:1711, female:8714, gender_unknown:59,
    ios:5094, android:4347, device_unknown:1043,
    age_under17:120, age_18_24:68, age_25_29:161,
    age_30_39:2437, age_40_49:6926, age_50plus:772, age_unknown:-1,
    shanghai:7290, jiangsu:460, guangdong:347, zhejiang:298, beijing:235,
    region_other:-1
  }
];

let records=[], charts={}, activeTab='table';

function computeAuto(entry) {
  const r = {...entry};
  for (const [autoKey, siblings] of Object.entries(AUTO_KEYS)) {
    if (r[autoKey] === null || r[autoKey] === undefined || r[autoKey] === -1) {
      const sibSum = siblings.reduce((s,k) => s+(r[k]||0), 0);
      r[autoKey] = Math.max(0, (r.total||0) - sibSum);
    }
  }
  return r;
}

function pct(count, total) {
  if (!total) return 0;
  return parseFloat((count/total*100).toFixed(2));
}

function load() {
  try {
    const s = localStorage.getItem(SK);
    if (s) records = JSON.parse(s);
    else { records = SEED; persist(); }
  } catch { records = SEED; }
}
function persist() { localStorage.setItem(SK, JSON.stringify(records)); }
function sorted() { return [...records].sort((a,b)=>a.date.localeCompare(b.date)); }
function getR(r) { return computeAuto(r); }

function dltCount(cur, prev, key) {
  if (!prev) return null;
  return getR(cur)[key] - getR(prev)[key];
}
function dltPct(cur, prev, key) {
  if (!prev) return null;
  const rc=getR(cur), rp=getR(prev);
  return parseFloat((pct(rc[key],rc.total) - pct(rp[key],rp.total)).toFixed(2));
}
function dH(d, unit) {
  if (d===null) return '<span class="nt">—</span>';
  if (d===0)   return '<span class="nt">0</span>';
  return d>0
    ? `<span class="up">+${Math.abs(d)}${unit}</span>`
    : `<span class="dn">−${Math.abs(d)}${unit}</span>`;
}

/* ── Tab 1 ── */
function renderTable() {
  const recs = sorted();
  if (!recs.length) { document.getElementById('tableView').innerHTML='<p style="color:var(--text3);padding:32px;text-align:center">暂无数据</p>'; return; }
  let h = '<div class="card"><div style="overflow-x:auto"><table><thead><tr>';
  h += '<th class="sc cg" style="text-align:left">分类</th>';
  h += '<th class="sc cl" style="text-align:left">指标</th>';
  recs.forEach(r => {
    h += `<th style="min-width:148px">${r.date}<br><button class="del-btn" onclick="deleteRecord('${r.date}')">删除</button></th>`;
  });
  h += '</tr></thead><tbody>';

  h += '<tr class="total-row"><td class="sc cg"><span style="font-size:11px;font-weight:600;color:var(--text2)">总计</span></td><td class="sc cl" style="color:var(--text2);font-weight:500">总人数</td>';
  recs.forEach((r,i) => {
    const d = i>0 ? getR(r).total - getR(recs[i-1]).total : null;
    h += `<td><div class="val" style="font-size:14px">${(r.total||0).toLocaleString()}</div><div class="pct">人</div><div style="margin-top:3px">${dH(d,'人')}</div></td>`;
  });
  h += '</tr>';

  GROUPS.forEach(group => {
    const gf = FIELDS.filter(f=>f.group===group);
    gf.forEach((field,fi) => {
      h += `<tr${field.isAuto?' class="other-row"':''}>`;
      if (fi===0) h += `<td class="sc cg" rowspan="${gf.length}" style="vertical-align:middle"><span class="badge ${BC[group]}">${group}</span></td>`;
      h += `<td class="sc cl" style="color:var(--text2)">${field.label}${field.isAuto?'<span style="font-size:9px;color:var(--text3);margin-left:4px">自动</span>':''}</td>`;
      recs.forEach((r,i) => {
        const prev = i>0?recs[i-1]:null;
        const rc = getR(r);
        const v = rc[field.key]||0;
        const p = pct(v,rc.total);
        const dc = dltCount(r,prev,field.key);
        const dp = dltPct(r,prev,field.key);
        h += `<td>
          <div class="val">${v.toLocaleString()}</div>
          <div class="pct">${p.toFixed(2)}%</div>
          <div style="margin-top:3px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap">
            ${dH(dc,'人')}${dH(dp,'pp')}
          </div>
        </td>`;
      });
      h += '</tr>';
    });
  });
  h += '</tbody></table></div></div>';
  document.getElementById('tableView').innerHTML = h;
}

/* ── Tab 2 ── */
function renderDaily() {
  const recs = sorted().reverse();
  if (!recs.length) { document.getElementById('dailyView').innerHTML='<p style="color:var(--text3);padding:32px;text-align:center">暂无数据</p>'; return; }
  let h = '';
  recs.forEach((r,idx) => {
    const rc = getR(r);
    const id = 'dy_'+idx;
    function pill(label, key, hi, isOther) {
      const v=rc[key]||0, p=pct(v,rc.total);
      const cls = isOther?'pill pill-other':(hi?'pill pill-hi':'pill');
      return `<span class="${cls}">${label}&nbsp;&nbsp;<strong>${v.toLocaleString()}</strong>&nbsp;<span style="opacity:.6">${p.toFixed(2)}%</span></span>`;
    }
    h += `<div class="day-card">
      <div class="day-header" id="hdr_${id}" onclick="toggleDay('${id}')">
        <div class="day-date-row">
          <div class="day-dot"></div>
          <div>
            <div class="day-date">${r.date}</div>
            <div class="day-total">总人数 ${(r.total||0).toLocaleString()} 人</div>
          </div>
        </div>
        <div class="day-tog" id="tog_${id}">▼</div>
      </div>
      <div class="day-body" id="${id}">
        <div class="day-section"><div class="day-sec-title">性别</div><div class="pills">
          ${pill('男性','male',false,false)}
          ${pill('女性','female',true,false)}
          ${pill('未知','gender_unknown',false,true)}
        </div></div>
        <div class="day-section"><div class="day-sec-title">访问设备</div><div class="pills">
          ${pill('iOS','ios',true,false)}
          ${pill('安卓','android',false,false)}
          ${pill('未知','device_unknown',false,true)}
        </div></div>
        <div class="day-section"><div class="day-sec-title">年龄分布</div><div class="pills">
          ${pill('17岁以下','age_under17',false,false)}
          ${pill('18-24岁','age_18_24',false,false)}
          ${pill('25-29岁','age_25_29',false,false)}
          ${pill('30-39岁','age_30_39',false,false)}
          ${pill('40-49岁','age_40_49',true,false)}
          ${pill('50岁以上','age_50plus',false,false)}
          ${pill('未知','age_unknown',false,true)}
        </div></div>
        <div class="day-section"><div class="day-sec-title">地域分布</div><div class="pills">
          ${pill('上海市','shanghai',true,false)}
          ${pill('江苏省','jiangsu',false,false)}
          ${pill('广东省','guangdong',false,false)}
          ${pill('浙江省','zhejiang',false,false)}
          ${pill('北京市','beijing',false,false)}
          ${pill('其他地区','region_other',false,true)}
        </div></div>
        <div class="day-actions">
          <button class="btn-sm btn-edit" onclick="editRecord('${r.date}')">✏️ 编辑</button>
          <button class="btn-sm btn-delete" onclick="deleteRecord('${r.date}')">删除</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('dailyView').innerHTML = h;
  // open first
  const first = document.getElementById('dy_0');
  const firstHdr = document.getElementById('hdr_dy_0');
  const firstTog = document.getElementById('tog_dy_0');
  if (first) {
    first.classList.add('open');
    firstTog.classList.add('open');
    if (firstHdr) firstHdr.classList.add('open-header');
  }
}

function toggleDay(id) {
  const el=document.getElementById(id);
  const tog=document.getElementById('tog_'+id);
  const hdr=document.getElementById('hdr_'+id);
  if (el.classList.contains('open')) {
    el.classList.remove('open'); tog.classList.remove('open');
    if (hdr) hdr.classList.remove('open-header');
  } else {
    el.classList.add('open'); tog.classList.add('open');
    if (hdr) hdr.classList.add('open-header');
  }
}

/* ── Tab 3 ── */
function destroyCharts() { Object.values(charts).forEach(c=>c.destroy()); charts={}; }

function renderTrend() {
  destroyCharts();
  const recs = sorted();
  const el = document.getElementById('trendView');
  if (recs.length < 2) {
    el.innerHTML = '<div class="chart-card"><p class="no-data">需要至少 2 天数据才能显示折线趋势图</p></div>';
    return;
  }
  const labels = recs.map(r=>r.date.slice(5));
  let h = '';
  GROUPS.forEach(group => {
    h += `<div class="chart-card"><div class="chart-title">${group}占比趋势</div><div class="chart-sub">% · 悬停查看精确数值</div><div class="chart-wrap"><canvas id="ch_${group}"></canvas></div></div>`;
  });
  h += `<div class="chart-card"><div class="chart-title">总人数趋势</div><div class="chart-sub">人 · 悬停查看精确数值</div><div class="chart-wrap"><canvas id="ch_total"></canvas></div></div>`;
  el.innerHTML = h;

  Chart.defaults.color = '#55555f';
  Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';

  const baseOpts = {
    responsive:true, maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{
        position:'bottom',
        labels:{boxWidth:10,boxHeight:10,borderRadius:3,font:{size:11.5},padding:16,color:'#9898a6',
          usePointStyle:true, pointStyle:'circle'}
      }
    },
    scales:{
      x:{ grid:{color:'rgba(255,255,255,0.04)'}, ticks:{font:{size:11},color:'#55555f'} },
      y:{ grid:{color:'rgba(255,255,255,0.04)'}, ticks:{font:{size:11},color:'#55555f'} }
    }
  };

  GROUPS.forEach(group => {
    const gf = FIELDS.filter(f=>f.group===group);
    const pal = GP[group];
    const ctx = document.getElementById('ch_'+group).getContext('2d');
    charts['ch_'+group] = new Chart(ctx, {
      type:'line',
      data:{
        labels,
        datasets: gf.map((f,i)=>({
          label:f.label,
          data: recs.map(r=>pct(getR(r)[f.key]||0, r.total)),
          borderColor: pal[i%pal.length],
          backgroundColor: pal[i%pal.length].replace(')',',0.08)').replace('rgb','rgba'),
          borderWidth: f.isAuto?1.5:2,
          pointRadius:4, pointHoverRadius:6,
          pointBackgroundColor: pal[i%pal.length],
          tension:0.4, fill:false, spanGaps:true,
          borderDash: f.isAuto?[4,3]:[],
        }))
      },
      options:{...baseOpts,
        plugins:{...baseOpts.plugins, tooltip:{
          backgroundColor:'rgba(20,20,22,0.95)',
          borderColor:'rgba(255,255,255,0.08)',
          borderWidth:1,
          titleColor:'#e8e8ec',
          bodyColor:'#9898a6',
          padding:12,
          callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}%`}
        }},
        scales:{...baseOpts.scales, y:{...baseOpts.scales.y, ticks:{...baseOpts.scales.y.ticks, callback:v=>v+'%'}}}
      }
    });
  });

  const ctx2 = document.getElementById('ch_total').getContext('2d');
  const grad = ctx2.createLinearGradient(0,0,0,240);
  grad.addColorStop(0,'rgba(124,106,247,0.15)');
  grad.addColorStop(1,'rgba(124,106,247,0)');
  charts['ch_total'] = new Chart(ctx2,{
    type:'line',
    data:{
      labels,
      datasets:[{
        label:'总人数',
        data:recs.map(r=>r.total||0),
        borderColor:'#7c6af7',
        backgroundColor:grad,
        borderWidth:2,
        pointRadius:4, pointHoverRadius:6,
        pointBackgroundColor:'#7c6af7',
        tension:0.4, fill:true,
      }]
    },
    options:{...baseOpts,
      plugins:{...baseOpts.plugins, tooltip:{
        backgroundColor:'rgba(20,20,22,0.95)',
        borderColor:'rgba(255,255,255,0.08)',
        borderWidth:1,
        titleColor:'#e8e8ec',
        bodyColor:'#9898a6',
        padding:12,
        callbacks:{label:ctx=>` 总人数: ${ctx.parsed.y.toLocaleString()}`}
      }},
      scales:{...baseOpts.scales, y:{...baseOpts.scales.y, ticks:{...baseOpts.scales.y.ticks, callback:v=>v.toLocaleString()}}}
    }
  });
}

function render() { renderTable(); renderDaily(); if(activeTab==='trend') renderTrend(); }

function switchTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tableView').style.display = tab==='table'?'':'none';
  document.getElementById('dailyView').style.display = tab==='daily'?'':'none';
  document.getElementById('trendView').style.display = tab==='trend'?'':'none';
  if (tab==='trend') renderTrend();
}

function openForm(prefillDate) {
  const date = prefillDate || new Date().toISOString().slice(0,10);
  const ex = records.find(r=>r.date===date)||{date};
  document.getElementById('f_date').value = date;
  INPUT_KEYS.forEach(k=>{
    const el=document.getElementById('f_'+k);
    if (!el) return;
    const v=ex[k];
    el.value=(v===undefined||v===null||v===-1)?'':v;
  });
  document.getElementById('modal').style.display='flex';
}
function editRecord(date) { openForm(date); }
function closeForm() { document.getElementById('modal').style.display='none'; }

function saveRecord() {
  const d = document.getElementById('f_date').value;
  if (!d) { alert('请选择日期'); return; }
  const entry = {date:d};
  INPUT_KEYS.forEach(k=>{
    const el=document.getElementById('f_'+k);
    if (!el) return;
    const val=el.value.trim();
    const isAutoKey=Object.keys(AUTO_KEYS).includes(k);
    if (isAutoKey && val==='') entry[k]=-1;
    else entry[k]=parseInt(val)||0;
  });
  const idx=records.findIndex(r=>r.date===d);
  if (idx>=0) records[idx]=entry; else records.push(entry);
  persist(); render(); closeForm();
  const msg=document.getElementById('savedMsg');
  msg.style.display='flex'; setTimeout(()=>msg.style.display='none',2500);
}

function deleteRecord(date) {
  if (!confirm(`确认删除 ${date} 的数据？`)) return;
  records=records.filter(r=>r.date!==date);
  persist(); render();
}

load(); render();
</script>
</body>
</html>
